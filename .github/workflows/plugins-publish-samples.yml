name: Plugins publish samples

# Manually invoked. Permissions default to those with repo `write` access.
# https://docs.github.com/en/actions/using-workflows/manually-running-a-workflow
on: workflow_dispatch

# Default permissions are read only.
permissions: read-all

# Variables. The workflow also depends on secrets.GAR_TOKEN.
env:
  REGISTRY: us-docker.pkg.dev
  PROJECT: service-extensions-samples
  STAGING_REPOSITORY: ${{ github.repository_owner == 'GoogleCloudPlatform' && 'plugins-staging' || 'plugins-testing-staging' }}
  TARGET_REPOSITORY: ${{ github.repository_owner == 'GoogleCloudPlatform' && 'plugins-source' || 'plugins-testing-source' }}

jobs:
  build-and-push-images:
    name: Publish plugins sample ${{ matrix.image }}
    runs-on: ubuntu-latest

    # Permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read

    strategy:
      matrix:
        include:
        - image: 'local-reply'
          dir: 'local_reply'
          target: 'plugin_cpp.wasm'
        - image: 'enable-recaptcha'
          dir: 'enable_recaptcha'
          target: 'plugin_rust.wasm'

    steps:
      # Get latest repo.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Authenticate to GCP.
      - name: Login to GCP
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GAR_TOKEN }}

      # Install gcloud CLI.
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Authenticate to GAR.
      - name: Login to Google Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: _json_key
          password: ${{ secrets.GAR_TOKEN }}

      # Build the plugin.
      - name: Build wasm plugin
        shell: bash
        working-directory: ./plugins
        run: >
          bazel build
          --verbose_failures
          //samples/${{ matrix.dir }}:${{ matrix.target }}

      # Copy output to avoid Docker-incompatible bazel symlink
      - name: Copy wasm plugin
        shell: bash
        working-directory: ./plugins
        run: >
          cp -f bazel-bin/samples/${{ matrix.dir }}/${{ matrix.target }} plugin.wasm

      # Get metadata: https://github.com/docker/metadata-action#about
      # The `images` value provides the base name for tags and labels.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT }}/${{ env.STAGING_REPOSITORY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=public-image-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=Plugins sample ${{ matrix.image }}

      # Push Docker image to staging repository: https://github.com/docker/build-push-action#about
      # Uses the `tags` and `labels` from the `meta` step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./plugins
          file: ./plugins/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Attach license files to the image in the staging repository.
      - name: Attach license files
        shell: bash
        working-directory: ./plugins
        env:
          IMAGE_NAME: ${{ matrix.image }}
          GIT_SHA: ${{ github.sha }}
          TARGET_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          SAMPLE_DIR: ${{ matrix.dir }}
        run: |
          gcloud artifacts attachments delete \
            "${IMAGE_NAME}-licenses-${GIT_SHA}" \
            --location=us --repository="${STAGING_REPOSITORY}" \
            --quiet || true  # Allow failure
          gcloud artifacts attachments create \
            "${IMAGE_NAME}-licenses-${GIT_SHA}" \
            --location=us --repository="${STAGING_REPOSITORY}" \
            --target="${TARGET_TAG}" \
            --attachment-type=text/LICENSES \
            --files="$(ls "samples/${SAMPLE_DIR}/licenses/"* | tr '\n' ',')"

      # Promote Docker image from staging repository to target repository.
      - name: Promote Docker image to target repository
        uses: ./.github/actions/promote-gar-image
        with:
          credentials_json: ${{ secrets.GAR_TOKEN }}
          project: ${{ env.PROJECT }}
          staging_repository: ${{ env.STAGING_REPOSITORY }}
          target_repository: ${{ env.TARGET_REPOSITORY }}
          image: ${{ matrix.image }}
          digest: ${{ steps.push.outputs.digest }}

