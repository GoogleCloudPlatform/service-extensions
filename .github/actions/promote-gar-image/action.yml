name: 'Promote Artifact Registry Image'
description: 'Promotes a container image from a GAR staging repository to a target repository via the :promoteArtifact API, waits for completion, and deletes the staging artifact.'

inputs:
  project:
    description: 'GCP Project ID hosting the Artifact Registry repositories'
    required: true
  location:
    description: 'Artifact Registry location'
    required: false
    default: 'us'
  staging_repository:
    description: 'Source staging repository ID'
    required: true
  target_repository:
    description: 'Destination target repository ID'
    required: true
  image:
    description: 'Package / image name in the repository'
    required: true
  digest:
    description: 'Image digest (sha256:...)'
    required: true
  credentials_json:
    description: 'GCP service account key JSON used to authenticate gcloud before promoting.'
    required: true
  timeout_seconds:
    description: 'Total timeout in seconds to wait for the promoteArtifact LRO to complete'
    required: false
    default: '300'
  attestation_timeout_seconds:
    description: 'Total timeout in seconds to wait for the Artifact Analysis vulnerability attestation before promoting'
    required: false
    default: '600'

runs:
  using: 'composite'
  steps:
    - name: Authenticate to GCP
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
      with:
        credentials_json: ${{ inputs.credentials_json }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

    - name: Promote artifact and wait for completion
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_STAGING_REPO: ${{ inputs.staging_repository }}
        INPUT_TARGET_REPO: ${{ inputs.target_repository }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_DIGEST: ${{ inputs.digest }}
        INPUT_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        INPUT_ATTESTATION_TIMEOUT_SECONDS: ${{ inputs.attestation_timeout_seconds }}
      run: |
        set -euo pipefail
        DIGEST="${INPUT_DIGEST}"
        if [[ "${DIGEST}" != sha256:* ]]; then
          DIGEST="sha256:${DIGEST}"
        fi

        SRC_REPO="projects/${INPUT_PROJECT}/locations/${INPUT_LOCATION}/repositories/${INPUT_STAGING_REPO}"
        SRC_VER="${SRC_REPO}/packages/${INPUT_IMAGE}/versions/${DIGEST}"

        echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Waiting up to ${INPUT_ATTESTATION_TIMEOUT_SECONDS}s for Artifact Analysis vulnerability attestation on ${SRC_VER}..."
        ATT_POLL_INTERVAL=15
        ATT_DEADLINE=$((SECONDS + INPUT_ATTESTATION_TIMEOUT_SECONDS))
        while true; do
          ATT_NAME=$(gcloud artifacts attachments list \
            --project="${INPUT_PROJECT}" \
            --location="${INPUT_LOCATION}" \
            --repository="${INPUT_STAGING_REPO}" \
            --target="${SRC_VER}" \
            --filter='type="application/vnd.in-toto.vuln+dsse"' \
            --format='value(name)' || true)
          if [[ -n "${ATT_NAME}" ]]; then
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Found vulnerability attestation attachment: ${ATT_NAME}"
            break
          fi
          if (( SECONDS >= ATT_DEADLINE )); then
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Timed out after ${INPUT_ATTESTATION_TIMEOUT_SECONDS}s waiting for vulnerability attestation on ${SRC_VER}."
            exit 1
          fi
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Vulnerability attestation not yet present; sleeping ${ATT_POLL_INTERVAL}s..."
          sleep "${ATT_POLL_INTERVAL}"
        done

        PROMOTE_URL="https://artifactregistry.googleapis.com/v1/projects/${INPUT_PROJECT}/locations/${INPUT_LOCATION}/repositories/${INPUT_TARGET_REPO}:promoteArtifact"
        PAYLOAD=$(jq -n \
          --arg src_repo "${SRC_REPO}" \
          --arg src_ver "${SRC_VER}" \
          '{
            source_repository: $src_repo,
            source_version: $src_ver,
            attachment_behavior: "INCLUDE",
            include_all_tags: true,
            overwrite_tags: true
          }')

        ACCESS_TOKEN="$(gcloud auth print-access-token)"
        echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Promoting ${INPUT_IMAGE}@${DIGEST} from ${INPUT_STAGING_REPO} to ${INPUT_TARGET_REPO}..."
        RESPONSE=$(curl -sS -X POST "${PROMOTE_URL}" \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "Content-Type: application/json" \
          -d "${PAYLOAD}")

        OP_NAME=$(echo "${RESPONSE}" | jq -r '.name // empty')
        if [[ -z "${OP_NAME}" ]]; then
          echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Failed to start promoteArtifact operation. Response:"
          echo "${RESPONSE}"
          exit 1
        fi
        echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Started promotion operation: ${OP_NAME}"

        OP_URL="https://artifactregistry.googleapis.com/v1/${OP_NAME}"
        POLL_INTERVAL=5
        DEADLINE=$((SECONDS + INPUT_TIMEOUT_SECONDS))
        while true; do
          OP_STATUS=$(curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" "${OP_URL}" || true)
          DONE=$(echo "${OP_STATUS}" | jq -r '.done // false')
          if [[ "${DONE}" == "true" ]]; then
            ERROR=$(echo "${OP_STATUS}" | jq -r '.error // empty')
            if [[ -n "${ERROR}" && "${ERROR}" != "null" ]]; then
              echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Promotion operation failed:"
              echo "${OP_STATUS}" | jq .
              exit 1
            fi
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Promotion completed successfully:"
            echo "${OP_STATUS}" | jq .
            break
          fi
          if (( SECONDS >= DEADLINE )); then
            echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Timed out after ${INPUT_TIMEOUT_SECONDS}s waiting for promotion operation ${OP_NAME} to complete."
            echo "${OP_STATUS}" | jq . || echo "${OP_STATUS}"
            exit 1
          fi
          sleep "${POLL_INTERVAL}"
        done

    - name: Clean up artifact in staging repository
      shell: bash
      env:
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_LOCATION: ${{ inputs.location }}
        INPUT_STAGING_REPO: ${{ inputs.staging_repository }}
        INPUT_IMAGE: ${{ inputs.image }}
      run: |
        set -euo pipefail
        STAGING_PACKAGE="${INPUT_LOCATION}-docker.pkg.dev/${INPUT_PROJECT}/${INPUT_STAGING_REPO}/${INPUT_IMAGE}"
        echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] Deleting promoted package ${STAGING_PACKAGE} from staging repository..."
        gcloud artifacts docker images delete "${STAGING_PACKAGE}" --quiet
