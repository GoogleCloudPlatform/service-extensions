# Optional gateway config, modeled on LiteLLM's config.yaml. This is the file
# format the callout reads: mount it into the container (or bake it into the
# image) and set GATEWAY_CONFIG=/path/to/config.yaml.
#
# If you deploy with deploy/terraform-regional, you do not need this file.
# Set the same content in the `gateway_config` variable in terraform.tfvars
# instead; Terraform renders it into a Secret Manager secret and mounts it at
# GATEWAY_CONFIG for you. This file is here for deployments that do not use
# that Terraform config, and as the reference for the format.
#
# The config is the ROUTING FEATURE FLAG: the strategies in routing.py ship
# disabled (empty tables), and the router_settings section below is what
# turns them on. Without it the callout is the plain translation gateway:
# no header rewrites, and the request body's model is always served as-is.

router_settings:
  # LiteLLM model_group_alias: friendly alias -> full model id. The client
  # sends the alias in x-model-id; the route extension resolves it.
  model_group_alias:
    fast: vertex_ai/gemini-2.5-flash
    smart: anthropic/claude-haiku-4-5
    cheap: openrouter/openai/gpt-oss-20b:free

  # Tag-based routing: (provider prefix, tag) -> target model.
  tag_rules:
    - provider_prefix: vertex_ai/
      tag: premium
      target: vertex_ai/gemini-2.5-pro

  # A/B / weighted split across a model group (stable hash of x-request-id).
  weighted_groups:
    vertex_ai/gemini-2.5-flash:
      - model: vertex_ai/gemini-2.5-flash
        weight: 70
      - model: vertex_ai/gemini-2.5-pro
        weight: 30

  # simple-shuffle: random member of a model group per request.
  shuffle_groups:
    vertex-shuffle:
      - vertex_ai/gemini-2.5-flash
      - vertex_ai/gemini-2.5-pro

litellm_settings:
  # As in LiteLLM: omit the hashed virtual key from telemetry when true.
  redact_user_api_key_info: false

general_settings:
  # Allow requests through when Redis is unreachable (LiteLLM's fail-open
  # vs fail_closed_budget_enforcement choice). Env QUOTA_FAIL_OPEN wins.
  quota_fail_open: true
