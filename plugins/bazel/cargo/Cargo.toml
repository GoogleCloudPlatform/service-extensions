[package]
name = "service-extensions"
version = "0.0.0"
edition = "2018"

# Regenerate: $ bazelisk run bazel/cargo:crates_vendor -- --repin
# Reference: //bazel/cargo/remote:proxy-wasm (etc)
[dependencies]
proxy-wasm = "=0.2.1"
log = "=0.4.20"
regex = "=1.9.6"
url = "=2.4.0"
# Pin version 2.0.0 until rust-version includes https://github.com/rust-lang/rust/issues/119128
lol_html = "=2.0.0"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
uuid = { version = "1.12.1", features = [ "v4" ] }
sha2 = "=0.10.8"
hmac = "=0.12.1"
hex = "=0.4.3"

p256 = { version = "=0.13.0", default-features = false, features = ["ecdsa"] }
ecdsa = "=0.16.0"
getrandom = { version = "=0.2.14", default-features = false }
zeroize = "=1.8.1"
rand_core = "=0.6.4"
once_cell = "=1.19.0"

[lib]
crate-type = ["cdylib"]
path = "samples/.../plugin.rs"  # dummy value for Bazel

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
strip = "debuginfo"
